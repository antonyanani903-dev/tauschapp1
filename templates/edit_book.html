{% extends "base.html" %}
{% block title %}Buch bearbeiten – {{ SITE_NAME }}{% endblock %}
{% block content %}
<h1 class="page-title">Buch bearbeiten</h1>
<form class="addbook" method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="title">Titel</label>
  <input id="title" name="title" value="{{ book.title }}" required maxlength="255">
  <label for="author">Autor/in</label>
  <input id="author" name="author" value="{{ book.author }}" required maxlength="255">
  <label for="condition">Zustand</label>
  <select id="condition" name="condition">
    {% for c in CONDITIONS %}<option {{ 'selected' if c == book.condition else '' }}>{{ c }}</option>{% endfor %}
  </select>
  <label for="description">Beschreibung</label>
  <textarea id="description" name="description" maxlength="1000" rows="3">{{ book.description or '' }}</textarea>
  {% if photos %}
  <label>Fotos <span class="optional">(Titelbild = erstes Foto)</span></label>
  <div class="gallery">
    {% for ph in photos %}
    <div class="g-item">
      <img src="{{ ph.url }}" alt="">
      <label class="g-opt"><input type="radio" name="cover_image_id" value="{{ ph.id }}" {{ 'checked' if loop.first else '' }}> Titelbild</label>
      <label class="g-opt danger"><input type="checkbox" name="remove_image_ids" value="{{ ph.id }}"> Entfernen</label>
    </div>
    {% endfor %}
  </div>
  {% endif %}
  <label for="images">{% if photos %}Weitere Fotos hinzufügen{% else %}Fotos{% endif %} <span class="optional">(insgesamt bis zu 5)</span></label>
  <input id="images" type="file" name="images" accept="image/*" multiple data-compress data-max="{{ 5 - photos|length if photos else 5 }}">
  <p class="footnote" data-file-summary></p>
  <button type="submit">Speichern</button>
  <p style="text-align:center;margin-top:12px"><a class="link-btn" href="{{ url_for('my_books') }}">Abbrechen</a></p>
</form>
{% endblock %}
