{% extends "base.html" %}
{% block title %}Neues Passwort – {{ SITE_NAME }}{% endblock %}
{% block content %}
<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h1>Neues Passwort</h1>
  <label for="password">Neues Passwort <span class="optional">(mind. 8 Zeichen)</span></label>
  <input id="password" type="password" name="password" required minlength="8" autofocus autocomplete="new-password">
  <label for="password2">Passwort wiederholen</label>
  <input id="password2" type="password" name="password2" required minlength="8" autocomplete="new-password">
  <button type="submit">Passwort speichern</button>
</form>
{% endblock %}
