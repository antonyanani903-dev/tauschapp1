{% extends "base.html" %}
{% block title %}Passwort vergessen – {{ SITE_NAME }}{% endblock %}
{% block content %}
<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h1>Passwort vergessen?</h1>
  <p class="muted">Gib deine E-Mail-Adresse ein. Wir schicken dir einen Link, mit dem du ein neues Passwort setzen kannst.</p>
  <label for="email">E-Mail</label>
  <input id="email" type="email" name="email" required autofocus autocomplete="email">
  <button type="submit">Link senden</button>
  <p class="auth-switch"><a href="{{ url_for('login') }}">Zurück zur Anmeldung</a></p>
</form>
{% endblock %}
